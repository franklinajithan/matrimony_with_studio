name: Public Browser Smoke
on:
  push:
    branches: [main]
    paths:
      - 'e2e/public-site-smoke.spec.ts'
      - '.github/workflows/public-browser-smoke.yml'
  pull_request:
    paths:
      - 'e2e/public-site-smoke.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/public-browser-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read-only production public smoke
        run: npx playwright test e2e/public-site-smoke.spec.ts --project=chromium --project=mobile-chrome
        env:
          PLAYWRIGHT_BASE_URL: https://cupidmatch.co.uk
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
