name: Marriage registration acceptance
on:
  pull_request:
    paths:
      - 'src/components/onboarding/**'
      - 'src/components/i18n/**'
      - 'src/lib/onboarding/**'
      - 'src/app/(auth)/**'
      - 'scripts/browser-registration-acceptance.mjs'
      - 'scripts/marriage-onboarding.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/registration-ui.yml'
  workflow_dispatch:
jobs:
  isolated-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:marriage-onboarding
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-registration
