name: Build CupidMatch Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Generate standalone Android wrapper
        run: |
          mkdir -p /tmp/cupidmatch-android/www
          cd /tmp/cupidmatch-android
          echo '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>CupidMatch</body></html>' > www/index.html
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "uk.co.cupidmatch.app",
            "appName": "CupidMatch",
            "webDir": "www",
            "server": {
              "url": "https://cupidmatch.co.uk",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/CupidMatch-test.apk"
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: CupidMatch-Android-Test-APK
          path: apk/CupidMatch-test.apk
          if-no-files-found: error
          retention-days: 14
