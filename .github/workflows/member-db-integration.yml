name: Member database integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/2026110812*.sql'
      - 'supabase/migrations/2026110813*.sql'
      - 'supabase/migrations/2026110814*.sql'
      - 'scripts/qa-member-db-*.sql'
      - '.github/workflows/member-db-integration.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/2026110812*.sql'
      - 'supabase/migrations/2026110813*.sql'
      - 'supabase/migrations/2026110814*.sql'
      - 'scripts/qa-member-db-*.sql'
jobs:
  member-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: qa
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client when needed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Execute relationship migrations and isolated integration test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/qa-member-db-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108120000_atomic_member_connection_removal.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108130000_harden_interest_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108140000_revoke_disconnected_chat_access.sql
          psql -v ON_ERROR_STOP=1 -f scripts/qa-member-db-tests.sql
