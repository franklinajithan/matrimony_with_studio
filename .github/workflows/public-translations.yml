name: Public translation browser QA
on:
  push:
    branches: [main]
    paths:
      - 'src/components/i18n/**'
      - 'src/components/subscriptions/PricingIntroduction.tsx'
      - 'src/app/(main)/pricing/page.tsx'
      - 'e2e/site-translations.spec.ts'
      - '.github/workflows/public-translations.yml'
  workflow_dispatch:
jobs:
  public-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed public translations (read-only)
        run: npx playwright test e2e/site-translations.spec.ts --project=chromium --grep "I18N-010"
        env:
          PLAYWRIGHT_BASE_URL: https://cupidmatch.co.uk
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-translations-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
