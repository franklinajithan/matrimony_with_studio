name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/whatsapp-share-preview.test.mjs
      - run: node --test scripts/auth-session.test.cjs
      - run: npm run test:marriage-onboarding
      - run: npm run test:theme
      - run: npm run test:admin
      - run: npm run test:horoscope
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test scripts/admin-audit-pagination.test.cjs scripts/admin-audit-ui.test.cjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

