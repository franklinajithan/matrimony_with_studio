name: Payment preparation acceptance
on:
  pull_request:
    paths:
      - 'src/components/subscriptions/**'
      - 'src/app/admin/payments/**'
      - 'src/app/membership/**'
      - 'src/app/api/payments/**'
      - 'src/app/api/admin/payments/**'
      - 'src/lib/subscriptions/**'
      - 'scripts/*payment*'
      - 'scripts/premium*'
      - 'supabase/migrations/*premium*'
      - 'supabase/migrations/*payment*'
      - '.github/workflows/payments-ui.yml'
  workflow_dispatch:
jobs:
  isolated-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:payments
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-payments
