name: Admin security checks
on:
  push:
    branches: [main]
    paths:
      - 'src/app/admin/**'
      - 'src/app/api/admin/**'
      - 'src/lib/auth/admin.ts'
      - 'scripts/admin-security.test.cjs'
      - '.github/workflows/admin-security.yml'
  pull_request:
    paths:
      - 'src/app/admin/**'
      - 'src/app/api/admin/**'
      - 'src/lib/auth/admin.ts'
      - 'scripts/admin-security.test.cjs'
jobs:
  admin-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:admin
      - run: npx tsc --noEmit
