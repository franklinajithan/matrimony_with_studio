<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your CupidMatch verification code</title></head>
<body style="margin:0;background:#FFFCF7;font-family:Arial,sans-serif;color:#351944">
  <main style="max-width:560px;margin:32px auto;padding:32px 24px;background:#ffffff;border:1px solid #C6A15B;border-radius:16px">
    <h1 style="margin:0 0 16px;color:#482153;font-size:26px">Verify your CupidMatch account</h1>
    <p>Enter this one-time code in CupidMatch to verify your identity:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px;color:#482153">{{ .Token }}</p>
    <p>You can also <a href="{{ .ConfirmationURL }}" style="color:#482153">sign in securely</a> using this link.</p>
    <p style="color:#6B5A70;font-size:14px">If you did not request this email, ignore it. Do not share your verification code with anyone.</p>
  </main>
</body>
</html>
